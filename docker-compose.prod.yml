services:
  postgres:
    image: postgres:17-alpine
    container_name: eskista-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5436}:5432'
    volumes:
      - eskista_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eskista-net

  redis:
    image: redis:7-alpine
    container_name: eskista-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - eskista_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eskista-net

  api:
    build:
      context: .
      target: production
    container_name: eskista-api
    restart: always
    command: node dist/src/main
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
    ports:
      - '3030:3000'
    volumes:
      - eskista_api_storage:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - eskista-net

volumes:
  eskista_postgres_data:
  eskista_redis_data:
  eskista_api_storage:

networks:
  eskista-net:
    driver: bridge
