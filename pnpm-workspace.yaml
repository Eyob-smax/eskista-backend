# pnpm 11 reads settings from here rather than the "pnpm" field in package.json.
# Prisma needs its install scripts to fetch/generate the query engine, and argon2
# compiles a native binding. @scarf/scarf is analytics only, so it stays blocked.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  argon2: true
  '@scarf/scarf': false
  # SWC compiles Vitest's TypeScript; its postinstall fetches the platform binary.
  '@swc/core': true
  # Optional native accelerator for msgpackr, which BullMQ uses to encode jobs. Pure-JS
  # fallback is correct and fast enough for our volumes, so the native build stays off
  # rather than becoming a compiler dependency on every machine and CI image.
  msgpackr-extract: false
