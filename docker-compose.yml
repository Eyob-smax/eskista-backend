services:
  postgres:
    image: postgres:17-alpine
    container_name: eskista-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eskista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eskista_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-eskista}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eskista} -d ${POSTGRES_DB:-eskista}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eskista-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: development
    container_name: eskista-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-eskista}:${POSTGRES_PASSWORD:-eskista_dev_pw}@postgres:5432/${POSTGRES_DB:-eskista}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - api_storage:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: pnpm start:dev

volumes:
  postgres_data:
  redis_data:
  api_storage:
